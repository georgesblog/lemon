name: Deploy to GitHub Pages

# Builds the PWA and publishes it to GitHub Pages on every push to the working
# branch. Pages serves project sites under /<repo>/, so we build with
# BASE_PATH=/lemon/ to match https://georgesblog.github.io/lemon/.
on:
  push:
    branches:
      - claude/basket-score-app-mgzyhh
  workflow_dispatch:

# Permissions the deploy-pages action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /lemon/
      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on automatically so no manual repo-settings step is
          # needed (requires the repo to be eligible for Pages).
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
